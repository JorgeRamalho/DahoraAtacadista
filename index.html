<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dahora Atacadista</title>
    <meta
      name="description"
      content="Redirecionando para o site oficial Dahora Atacadista (mesmo app da Vercel e da porta 3010)."
    />
    <script>
      (function () {
        var q = location.search + location.hash;
        var host = location.hostname;
        var isLocal =
          host === "localhost" ||
          host === "127.0.0.1" ||
          host === "[::1]" ||
          location.protocol === "file:";

        if (isLocal) {
          location.replace("http://127.0.0.1:3010/" + q);
          return;
        }

        if (host === "dahora-atacadista.vercel.app" || host.endsWith(".vercel.app")) {
          location.replace("/" + q);
          return;
        }

        location.replace("https://dahora-atacadista.vercel.app/" + q);
      })();
    </script>
  </head>
  <body>
    <p>
      Abrindo o site oficial
      <a href="https://dahora-atacadista.vercel.app/">Dahora Atacadista</a>
      (local:
      <a href="http://127.0.0.1:3010/">http://127.0.0.1:3010/</a>).
    </p>
  </body>
</html>
